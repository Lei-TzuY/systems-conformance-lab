name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Capture Ruff diagnostics
        run: python -m ruff check . --output-format=json > ruff.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-${{ matrix.os }}-${{ matrix.python-version }}
          path: ruff.json
      - name: Enforce Ruff
        run: python -c "import json,sys; sys.exit(1 if json.load(open('ruff.json', encoding='utf-8')) else 0)"
